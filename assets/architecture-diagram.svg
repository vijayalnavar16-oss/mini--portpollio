<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="espGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="actuatorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1000" height="680" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Diagram Title / Header -->
  <text x="500" y="42" fill="#38bdf8" font-size="20" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="bold" text-anchor="middle">SYSTEM WORKING ARCHITECTURE &amp; DATA FLOW</text>
  <text x="500" y="65" fill="#94a3b8" font-size="12" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Sensors → Central ESP32-WROOM-32 Microcontroller → Actuators &amp; Indicators</text>

  <!-- COLUMN 1: SENSORS (INPUTS) -->
  <rect x="30" y="90" width="270" height="560" rx="10" fill="#0c1527" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="90" width="270" height="36" rx="10" fill="#1e293b"/>
  <text x="165" y="114" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">1. SENSORS (INPUT SUBSYSTEM)</text>

  <!-- Sensor 1: Front HC-SR04 -->
  <g transform="translate(45, 140)">
    <rect x="0" y="0" width="240" height="68" rx="6" fill="url(#sensorGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Front HC-SR04 Sensor</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">App 1: Forward Obstacle Ranging</text>
    <text x="12" y="58" fill="#38bdf8" font-size="9" font-family="monospace">GPIO Trigger / Echo Pulses</text>
  </g>

  <!-- Sensor 2: Left HC-SR04 -->
  <g transform="translate(45, 220)">
    <rect x="0" y="0" width="240" height="68" rx="6" fill="url(#sensorGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Left HC-SR04 Sensor</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">App 2: Left Blind Spot Zone</text>
    <text x="12" y="58" fill="#fbbf24" font-size="9" font-family="monospace">GPIO Trigger / Echo Pulses</text>
  </g>

  <!-- Sensor 3: Right HC-SR04 -->
  <g transform="translate(45, 300)">
    <rect x="0" y="0" width="240" height="68" rx="6" fill="url(#sensorGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Right HC-SR04 Sensor</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">App 2: Right Blind Spot Zone</text>
    <text x="12" y="58" fill="#fbbf24" font-size="9" font-family="monospace">GPIO Trigger / Echo Pulses</text>
  </g>

  <!-- Sensor 4: LDR Module -->
  <g transform="translate(45, 380)">
    <rect x="0" y="0" width="240" height="68" rx="6" fill="url(#sensorGrad)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">LDR Light Sensor Module</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">App 3: Ambient Lux Measurement</text>
    <text x="12" y="58" fill="#67e8f9" font-size="9" font-family="monospace">Analog ADC Input / Comparator</text>
  </g>

  <!-- Sensor 5: MPU6050 IMU -->
  <g transform="translate(45, 460)">
    <rect x="0" y="0" width="240" height="68" rx="6" fill="url(#sensorGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">MPU6050 6-Axis IMU</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">App 4: Impact / Sudden Movement</text>
    <text x="12" y="58" fill="#c084fc" font-size="9" font-family="monospace">I2C Protocol (SDA / SCL Pins)</text>
  </g>

  <!-- Safety: Emergency Push Button -->
  <g transform="translate(45, 540)">
    <rect x="0" y="0" width="240" height="68" rx="6" fill="url(#sensorGrad)" stroke="#ef4444" stroke-width="2"/>
    <text x="12" y="24" fill="#f87171" font-size="12" font-weight="bold" font-family="sans-serif">Emergency Push Button</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">Manual Safety Override</text>
    <text x="12" y="58" fill="#fca5a5" font-size="9" font-family="monospace">Digital Interrupt GPIO (Active-LOW)</text>
  </g>

  <!-- COLUMN 2: CENTRAL ESP32 (SINGLE CONTROLLER) -->
  <rect x="370" y="90" width="260" height="560" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  <rect x="370" y="90" width="260" height="36" rx="10" fill="#0369a1"/>
  <text x="500" y="114" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">2. ESP32-WROOM-32 DEVKIT V1</text>
  <text x="500" y="145" fill="#7dd3fc" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">SINGLE CONTROLLER ARCHITECTURE</text>
  <text x="500" y="162" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">Xtensa 32-bit Dual-Core MCU</text>

  <!-- Internal Firmware Processing Blocks -->
  <g transform="translate(385, 175)">
    <!-- Logic 1 -->
    <rect x="0" y="0" width="230" height="60" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="10" y="20" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif">App 1 Logic: Distance Check</text>
    <text x="10" y="36" fill="#cbd5e1" font-size="9" font-family="monospace">Evaluate Echo Time vs Critical Margin</text>
    <text x="10" y="50" fill="#94a3b8" font-size="8" font-family="monospace">IF &lt; threshold → STOP Motors &amp; BUZZ</text>

    <!-- Logic 2 -->
    <rect x="0" y="70" width="230" height="60" rx="5" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="10" y="90" fill="#fbbf24" font-size="10" font-weight="bold" font-family="sans-serif">App 2 Logic: Blind Spot Eval</text>
    <text x="10" y="106" fill="#cbd5e1" font-size="9" font-family="monospace">Check Left / Right Lateral Range</text>
    <text x="10" y="120" fill="#94a3b8" font-size="8" font-family="monospace">IF &lt; flank limit → Turn ON Side LED</text>

    <!-- Logic 3 -->
    <rect x="0" y="140" width="230" height="60" rx="5" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
    <text x="10" y="160" fill="#22d3ee" font-size="10" font-weight="bold" font-family="sans-serif">App 3 Logic: Lux Threshold</text>
    <text x="10" y="176" fill="#cbd5e1" font-size="9" font-family="monospace">Sample LDR Voltage Divider</text>
    <text x="10" y="190" fill="#94a3b8" font-size="8" font-family="monospace">Dark / Tunnel → Headlights ON; Day → OFF</text>

    <!-- Logic 4 -->
    <rect x="0" y="210" width="230" height="75" rx="5" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="10" y="230" fill="#c084fc" font-size="10" font-weight="bold" font-family="sans-serif">App 4 Logic: Impact Detector</text>
    <text x="10" y="246" fill="#cbd5e1" font-size="9" font-family="monospace">Monitor G-force &amp; Angular Acceleration</text>
    <text x="10" y="260" fill="#94a3b8" font-size="8" font-family="monospace">IF abnormal shock → Latch Stop &amp; Siren</text>
    <text x="10" y="274" fill="#a855f7" font-size="7.5" font-family="sans-serif" font-style="italic">(Prototype Impact Demonstration)</text>

    <!-- E-Stop Logic -->
    <rect x="0" y="295" width="230" height="55" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="10" y="315" fill="#f87171" font-size="10" font-weight="bold" font-family="sans-serif">E-Stop ISR Handler</text>
    <text x="10" y="331" fill="#cbd5e1" font-size="9" font-family="monospace">Hardware Interrupt Triggered</text>
    <text x="10" y="344" fill="#fca5a5" font-size="8" font-family="monospace">Instant PWM Kill + Audio Warning</text>
  </g>
  <text x="500" y="630" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">Firmware: Embedded C/C++ in Arduino IDE</text>

  <!-- COLUMN 3: ACTUATORS & INDICATORS (OUTPUTS) -->
  <rect x="700" y="90" width="270" height="560" rx="10" fill="#0c1527" stroke="#334155" stroke-width="1.5"/>
  <rect x="700" y="90" width="270" height="36" rx="10" fill="#1e293b"/>
  <text x="835" y="114" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">3. ACTUATORS &amp; INDICATORS</text>

  <!-- Output 1: L298N & Motors -->
  <g transform="translate(715, 140)">
    <rect x="0" y="0" width="240" height="95" rx="6" fill="url(#actuatorGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">L298N Driver + 2 DC Motors</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">Controlled by: App 1, App 4, E-Stop</text>
    <text x="12" y="58" fill="#e2e8f0" font-size="9" font-family="monospace">Normal State: Forward Drive</text>
    <text x="12" y="74" fill="#ef4444" font-size="9" font-family="monospace">Triggered State: Emergency Cutoff</text>
    <text x="12" y="88" fill="#38bdf8" font-size="8" font-family="monospace">Dual H-Bridge Direction &amp; PWM Pins</text>
  </g>

  <!-- Output 2: Blind Spot LEDs -->
  <g transform="translate(715, 250)">
    <rect x="0" y="0" width="240" height="85" rx="6" fill="url(#actuatorGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Left &amp; Right Warning LEDs</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">Controlled by: App 2 (Blind Spot)</text>
    <text x="12" y="58" fill="#fde047" font-size="9" font-family="monospace">Left LED: Flashes on Left Obstacle</text>
    <text x="12" y="74" fill="#fde047" font-size="9" font-family="monospace">Right LED: Flashes on Right Obstacle</text>
  </g>

  <!-- Output 3: Headlight LEDs -->
  <g transform="translate(715, 350)">
    <rect x="0" y="0" width="240" height="75" rx="6" fill="url(#actuatorGrad)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Automatic Headlight LEDs</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">Controlled by: App 3 (LDR)</text>
    <text x="12" y="58" fill="#67e8f9" font-size="9" font-family="monospace">ON: Low Ambient Light / Night</text>
    <text x="12" y="70" fill="#94a3b8" font-size="9" font-family="monospace">OFF: Daylight Conditions</text>
  </g>

  <!-- Output 4: Piezo Buzzer -->
  <g transform="translate(715, 440)">
    <rect x="0" y="0" width="240" height="85" rx="6" fill="url(#actuatorGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Warning Piezo Buzzer</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">Controlled by: App 1, App 4, E-Stop</text>
    <text x="12" y="58" fill="#fca5a5" font-size="9" font-family="monospace">Beep Tone: Obstacle Proximity</text>
    <text x="12" y="74" fill="#ef4444" font-size="9" font-family="monospace">Continuous Tone: Impact / E-Stop</text>
  </g>

  <!-- Output 5: Status Indicators -->
  <g transform="translate(715, 540)">
    <rect x="0" y="0" width="240" height="68" rx="6" fill="url(#actuatorGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="bold" font-family="sans-serif">Warning Indicator LEDs</text>
    <text x="12" y="42" fill="#94a3b8" font-size="10" font-family="monospace">Controlled by: App 4 &amp; E-Stop</text>
    <text x="12" y="58" fill="#c084fc" font-size="9" font-family="monospace">Visual Alarm for Impact / Halt Events</text>
  </g>

  <!-- CONNECTING ARROWS & DATA BUSES -->
  <!-- Inputs to ESP32 -->
  <path d="M 285 174 L 370 174" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 285 254 L 370 254" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 285 334 L 370 334" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 285 414 L 370 414" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 285 494 L 370 494" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 285 574 L 370 574" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- ESP32 to Outputs -->
  <path d="M 630 187 L 715 187" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 630 292 L 715 292" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 630 387 L 715 387" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 630 482 L 715 482" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M 630 574 L 715 574" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowCyan)"/>
</svg>