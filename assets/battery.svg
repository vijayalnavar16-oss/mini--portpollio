  <rect x="85" y="68" width="70" height="84" rx="6" fill="url(#batteryBody)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="79" y="98" width="6" height="24" rx="2" fill="#cbd5e1"/>
